name: Deploy DAG to AKS

on:
  push:
    paths:
      - 'dags/**'
  workflow_dispatch:  # ✅ Manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      run: az aks get-credentials --resource-group cvx_group --name sample --overwrite-existing

    - name: Copy DAG to Airflow Webserver & Scheduler
      run: |
        WEB_POD=$(kubectl get pod -n airflow -l component=webserver -o jsonpath="{.items[0].metadata.name}")
        SCHEDULER_POD=$(kubectl get pod -n airflow -l component=scheduler -o jsonpath="{.items[0].metadata.name}")
        kubectl cp dags/hello_world.py airflow/$WEB_POD:/opt/airflow/dags/
        kubectl cp dags/hello_world.py airflow/$SCHEDULER_POD:/opt/airflow/dags/

    - name: Restart Airflow components (optional but recommended)
      run: |
        kubectl rollout restart deployment airflow-webserver -n airflow
        kubectl rollout restart deployment airflow-scheduler -n airflow
